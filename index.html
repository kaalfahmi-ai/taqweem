<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة التقويم الذاتي</title>
<meta name="description" content="منصة التقويم الذاتي — مدرسة عروة بن الزبير الابتدائية">
<meta name="theme-color" content="#0891B2">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="التقويم الذاتي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #0891B2; font-family: Tahoma, "Segoe UI", sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(135deg, #0E7490, #0891B2 55%, #22D3EE); color: #fff; z-index: 2; transition: opacity .4s; }
  #splash img { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  #splash h1 { margin: 0; font-size: 24px; }
  #splash p { margin: 0; opacity: .9; font-size: 15px; }
  .dots span { display: inline-block; width: 9px; height: 9px; margin: 0 4px; border-radius: 50%; background: #fff; animation: b 1.2s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: .15s } .dots span:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%, 80%, 100% { transform: scale(.4); opacity: .5 } 40% { transform: scale(1); opacity: 1 } }
  #offline { display: none; position: fixed; inset: 0; z-index: 3; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: linear-gradient(135deg, #0E7490, #0891B2); color: #fff; text-align: center; padding: 24px; }
  #offline button { border: 0; border-radius: 12px; padding: 12px 26px; font-size: 16px; font-weight: bold; color: #0E7490; background: #fff; cursor: pointer; }
</style>
</head>
<body>
<div id="splash">
  <img src="icon-512.png" alt="">
  <h1>منصة التقويم الذاتي</h1>
  <p>مدرسة عروة بن الزبير الابتدائية</p>
  <div class="dots"><span></span><span></span><span></span></div>
</div>
<div id="offline">
  <img src="icon-192.png" alt="" width="96" height="96" style="border-radius:22px">
  <h2 style="margin:0">لا يوجد اتصال بالإنترنت</h2>
  <p style="margin:0">المنصة تحتاج اتصالاً لعرض الشواهد ورفعها.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
</div>
<iframe id="app" title="منصة التقويم الذاتي" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwlO0BpqSOxWphR1OXMAUG0UXVz4glFNf513mXCeV1xGvuLPxKDc5fMjr2MG-wfVTJ8aA/exec';
  var frame = document.getElementById('app'), splash = document.getElementById('splash'), off = document.getElementById('offline');
  function hideSplash() { splash.style.opacity = 0; setTimeout(function () { splash.style.display = 'none'; }, 400); }
  if (!navigator.onLine) { off.style.display = 'flex'; splash.style.display = 'none'; }
  else { frame.addEventListener('load', function () { setTimeout(hideSplash, 600); }); frame.src = APP_URL; setTimeout(hideSplash, 12000); }
  window.addEventListener('offline', function () { off.style.display = 'flex'; });
  window.addEventListener('online', function () { location.reload(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
